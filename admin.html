<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                My Video Site
            </a>

            <nav>
                <a href="index.html">Website</a>
            </nav>

        </div>

    </header>


    <main class="admin-container">


        <section id="loginBox" class="admin-box">

            <h1>Admin Login</h1>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>



        <section
            id="adminPanel"
            class="admin-box"
            style="display: none;"
        >

            <div class="admin-top">

                <h1>Admin Panel</h1>

                <button id="logoutButton">
                    Logout
                </button>

            </div>


            <h2>Upload Video</h2>


            <form id="uploadForm">

                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Video title"
                    required
                >


                <textarea
                    id="videoDescription"
                    placeholder="Description"
                ></textarea>


                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                    required
                >


                <button type="submit">
                    Upload & Publish
                </button>

            </form>


            <p id="uploadMessage"></p>


            <hr>


            <h2>Uploaded Videos</h2>


            <div id="adminVideoList">
                Loading...
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>

</body>
</html>
