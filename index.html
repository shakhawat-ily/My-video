<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video Site</title>

    <link rel="stylesheet" href="style.css">
    
</head>
   
<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="logo" id="siteLogo">
            My Video Site
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="page1.html">Page 1</a>
            <a href="page2.html">Page 2</a>
        </nav>
       
    </div>

</header>


<main>

    <!-- HERO -->

    <section
        id="heroSection"
        class="hero-section"
    >

        <div class="hero-content">

            <h1 id="heroTitle">
                Welcome
            </h1>

            <p id="heroDescription">
                Watch our latest content.
            </p>

            
        </div>

    </section>

    
    <!-- FEATURED -->

    <section class="content-section">

        <div class="section-header">

            <h2>
                Featured
            </h2>

        </div>

        <div
            id="featuredGrid"
            class="content-grid"
        ></div>

    </section>


    
    <!-- LATEST -->

    <section class="content-section">

        <div class="section-header">

            <h2>
                Latest Content
            </h2>

        </div>

        <div
            id="contentGrid"
            class="content-grid"
        ></div>

        <button
            id="nextPageButton"
            class="next-button"
        >
            Next
        </button>

    </section>

</main>


<footer class="site-footer">

    <p id="footerText">
        © 2026 My Video Site
    </p>

</footer>

    
</body>
</html>
